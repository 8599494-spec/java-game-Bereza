<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Space Dogfight — Lab 07 Performance, Pooling & Testing</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="dot"></span>
          <strong>SPACE DOGFIGHT</strong>
          <span class="badge">V8 POOL · 30Hz AUTH</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <button type="button" id="installPwaBtn" class="toggle hidden">Install App</button>
          <div id="statusBar" class="status">Disconnected</div>
        </div>
      </header>

      <section id="lobbyPanel" class="panel lobby">
        <h2>Join Arena</h2>
        <form id="joinForm" class="join-form">
          <label>
            Pilot Callsign
            <input id="playerNameInput" type="text" maxlength="20" value="Viper" required />
          </label>
          <label>
            Sector / Room
            <input id="roomNameInput" type="text" maxlength="24" value="Sector Alpha" required />
          </label>
          <button type="submit" id="connectBtn">Launch Ship</button>
        </form>
        <p class="hint">
          Controls: <b>W / ↑</b> Thrust · <b>A/D or ←/→</b> Turn · <b>Space</b> Laser · <b>Shift / E</b> Homing Missile
        </p>
      </section>

      <main id="gameStage" class="stage hidden">
        <div class="arena-wrap">
          <canvas id="gameCanvas" width="900" height="600"></canvas>
          <canvas id="netgraphCanvas" width="280" height="165" class="netgraph-overlay"></canvas>
        </div>

        <aside class="controls-bar">
          <div class="control-group">
            <label>Latency: <span id="latencyVal">0</span> ms
              <input id="latencySlider" type="range" min="0" max="300" step="10" value="0" />
            </label>
            <label>Jitter: <span id="jitterVal">0</span> ms
              <input id="jitterSlider" type="range" min="0" max="100" step="5" value="0" />
            </label>
            <label>Drop: <span id="dropVal">0</span>%
              <input id="dropSlider" type="range" min="0" max="30" step="1" value="0" />
            </label>
          </div>
          <div class="control-group buttons">
            <button type="button" id="togglePredictBtn" class="toggle active">Predict: ON</button>
            <button type="button" id="toggleCodecBtn" class="toggle active">Codec: BIN</button>
            <button type="button" id="toggleWorkerBtn" class="toggle">Worker: OFF</button>
            <button type="button" id="toggleRandBugBtn" class="toggle">RandBug: OFF</button>
            <button type="button" id="spawnBotsBtn">+8 Bots</button>
            <button type="button" id="disconnectBtn" class="danger">Leave</button>
          </div>
        </aside>

        <section class="social-grid">
          <div class="panel-box">
            <h3>Active Pilots (<span id="rosterCount">0</span>)</h3>
            <ul id="rosterList" class="roster-list"></ul>
          </div>
          <div class="panel-box chat-box">
            <h3>Sector Comms</h3>
            <div id="chatMessages" class="chat-messages"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" type="text" maxlength="160" placeholder="Send message to room..." />
              <button type="submit" id="chatSendBtn">Send</button>
            </form>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
