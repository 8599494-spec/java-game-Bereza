<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Dogfight — Lab 03</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050811;
        color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .stage {
        position: relative;
        width: 900px;
        height: 600px;
        border: 1px solid #1e293b;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      }
      canvas { display: block; width: 900px; height: 600px; }
      #lobby-root {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 17, 0.9);
        padding: 24px;
      }
      #lobby-root.visible { display: flex; }
      .lobby-card {
        width: 100%;
        max-width: 580px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 24px;
      }
      .lobby-title { margin: 0 0 6px; font-size: 20px; color: #38bdf8; }
      .lobby-sub { margin: 0 0 18px; font-size: 13px; color: #94a3b8; }
      .field-row { display: flex; gap: 10px; margin-bottom: 16px; }
      .field-row input {
        flex: 1;
        background: #020617;
        border: 1px solid #334155;
        color: #f8fafc;
        padding: 10px 12px;
        border-radius: 6px;
        font-family: inherit;
      }
      .btn {
        background: #0284c7;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
      }
      .btn:hover { background: #0369a1; }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-secondary { background: #1e293b; color: #cbd5e1; }
      .btn-secondary:hover { background: #334155; }
      .room-list { display: grid; gap: 10px; margin-bottom: 18px; }
      .room-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #1e293b;
        background: #020617;
        cursor: pointer;
      }
      .room-item.selected { border-color: #38bdf8; background: #0c192e; }
      .room-meta { font-size: 12px; color: #94a3b8; margin-top: 4px; }
      .lobby-status { font-size: 12px; color: #f87171; min-height: 18px; margin-bottom: 10px; }
      #retry-overlay {
        position: absolute;
        left: 50%;
        bottom: 56px;
        transform: translateX(-50%);
        display: none;
        gap: 10px;
      }
      #retry-overlay.visible { display: flex; }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="game" width="900" height="600"></canvas>
      <div id="retry-overlay">
        <button id="retry-btn" class="btn" type="button">Retry Loading</button>
        <button id="fallback-btn" class="btn btn-secondary" type="button">Start Without Failed Assets</button>
      </div>
      <div id="lobby-root"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
