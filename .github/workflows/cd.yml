name: CD — Build Container, Verify Runtime & Publish to GHCR

on:
  push:
    branches: [main]
    tags: ['lab-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build production Docker image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: space-dogfight:verify
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size (< 200 MB) and non-root user
        run: |
          SIZE_BYTES=$(docker image inspect space-dogfight:verify --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          if [ "$SIZE_MB" -ge 200 ]; then
            echo "ERROR: Image size ${SIZE_MB} MB exceeds 200 MB limit!"
            exit 1
          fi
          USER_NAME=$(docker image inspect space-dogfight:verify --format='{{.Config.User}}')
          echo "Container user: ${USER_NAME}"
          test "$USER_NAME" = "node"

      - name: Smoke-test container (/health, /ready, /metrics, graceful SIGTERM)
        run: |
          docker run -d --name game-verify -p 3000:3000 \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            space-dogfight:verify
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3000/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health | grep '"ok":true'
          curl -sf http://127.0.0.1:3000/ready | grep '"ready":true'
          curl -sf http://127.0.0.1:3000/metrics | grep 'game_connected_players'
          docker stop -t 10 game-verify
          EXIT_CODE=$(docker inspect game-verify --format='{{.State.ExitCode}}')
          echo "Container exit code after SIGTERM: ${EXIT_CODE}"
          docker rm game-verify
          test "$EXIT_CODE" = "0"

      - name: Push multi-tag image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Trigger hosting deploy webhook (if configured)
        if: secrets.DEPLOY_WEBHOOK_URL != ''
        run: |
          curl -fsSL -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"