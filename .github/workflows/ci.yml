name: CI — Typecheck, Lint, Tests, Build & E2E

on:
  push:
    branches: [main]
    tags: ['lab-*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Typecheck (shared, server, client)
        run: npm run typecheck

      - name: 2. Lint & Format Check (Biome)
        run: npm run lint

      - name: 3. Unit, Property & Integration Tests (Vitest + Coverage)
        run: npm run test:coverage

      - name: 4. Build Client Bundle & Web Worker (Vite)
        run: npm run build

      - name: 5. Install Chromium & Run Multiplayer E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore