services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_SHA: ${GIT_SHA:-local-compose}
    image: space-dogfight:local
    container_name: space-dogfight-game
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-24}
      MAX_ROOMS: ${MAX_ROOMS:-32}
      MAX_PLAYERS_PER_ROOM: ${MAX_PLAYERS_PER_ROOM:-160}
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s